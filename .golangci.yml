version: "2"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
    - misspell
    - unconvert
    - gocyclo
    - nestif
    - ineffassign
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 5
    misspell:
      locale: US
    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    paths:
      - vendor
      - .git
      - ".*\\.pb\\.go$"
    rules:
      - path: _test\.go$
        linters:
          - gocyclo
          - errcheck
          - unparam
          - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
